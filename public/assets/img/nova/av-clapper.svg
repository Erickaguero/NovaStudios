<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="ht" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#1D1D1D"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="42%" r="60%">
      <stop offset="0%" stop-color="#ECC80B" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#ECC80B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="#0E0E0E"/>
  <rect width="1200" height="900" fill="url(#ht)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- clapperboard -->
  <g transform="translate(600 470) rotate(-4)">
    <!-- top stick (open) -->
    <g transform="rotate(-18 -280 -160)">
      <rect x="-280" y="-205" width="560" height="80" rx="14" fill="#161616" stroke="#FEFEFE" stroke-width="7"/>
      <g>
        <rect x="-260" y="-198" width="70" height="66" fill="#ECC80B" transform="skewX(-18)"/>
        <rect x="-120" y="-198" width="70" height="66" fill="#FEFEFE" transform="skewX(-18)"/>
        <rect x="20" y="-198" width="70" height="66" fill="#ECC80B" transform="skewX(-18)"/>
        <rect x="160" y="-198" width="70" height="66" fill="#FEFEFE" transform="skewX(-18)"/>
      </g>
    </g>
    <!-- board -->
    <rect x="-280" y="-120" width="560" height="400" rx="22" fill="#161616" stroke="#ECC80B" stroke-width="7"/>
    <line x1="-240" y1="-20" x2="240" y2="-20" stroke="#ECC80B" stroke-width="6"/>
    <line x1="-240" y1="70" x2="240" y2="70" stroke="#ECC80B" stroke-width="6"/>
    <line x1="-240" y1="160" x2="240" y2="160" stroke="#ECC80B" stroke-width="6"/>
    <line x1="0" y1="-20" x2="0" y2="160" stroke="#ECC80B" stroke-width="6" opacity="0.6"/>
    <text x="-240" y="-55" font-family="Poppins, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="6" fill="#FEFEFE">ESCENA 01</text>
    <text x="-240" y="45" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="4" fill="#C8C8CD">TOMA</text>
    <text x="40" y="45" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="4" fill="#C8C8CD">NOVA</text>
    <text x="-240" y="135" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="600" letter-spacing="4" fill="#ECC80B">CON PROPÓSITO</text>
  </g>

  <text x="80" y="820" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="10" fill="#ECC80B">ACCIÓN</text>
  <text x="1120" y="820" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#5A5A5A">NOVA STUDIOS</text>
</svg>
