<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="ht" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#282828"/>
    </pattern>
  </defs>
  <rect width="1200" height="900" fill="#ECC80B"/>
  <rect width="1200" height="900" fill="url(#ht)" opacity="0.35"/>

  <!-- timeline / edit UI -->
  <rect x="120" y="120" width="960" height="90" rx="18" fill="#0E0E0E"/>
  <rect x="140" y="140" width="380" height="50" rx="10" fill="#ECC80B" opacity="0.9"/>
  <rect x="540" y="140" width="220" height="50" rx="10" fill="#FEFEFE" opacity="0.9"/>
  <rect x="780" y="140" width="280" height="50" rx="10" fill="#ECC80B" opacity="0.6"/>

  <!-- big waveform -->
  <g stroke="#0E0E0E" stroke-width="16" stroke-linecap="round">
    <line x1="160" y1="520" x2="160" y2="440"/>
    <line x1="220" y1="560" x2="220" y2="400"/>
    <line x1="280" y1="600" x2="280" y2="360"/>
    <line x1="340" y1="540" x2="340" y2="420"/>
    <line x1="400" y1="640" x2="400" y2="320"/>
    <line x1="460" y1="560" x2="460" y2="400"/>
    <line x1="520" y1="680" x2="520" y2="280"/>
    <line x1="580" y1="600" x2="580" y2="360"/>
    <line x1="640" y1="660" x2="640" y2="300"/>
    <line x1="700" y1="560" x2="700" y2="400"/>
    <line x1="760" y1="640" x2="760" y2="320"/>
    <line x1="820" y1="540" x2="820" y2="420"/>
    <line x1="880" y1="600" x2="880" y2="360"/>
    <line x1="940" y1="560" x2="940" y2="400"/>
    <line x1="1000" y1="520" x2="1000" y2="440"/>
  </g>
  <!-- playhead -->
  <line x1="600" y1="240" x2="600" y2="720" stroke="#FEFEFE" stroke-width="8"/>
  <path d="M 578 240 L 622 240 L 600 274 Z" fill="#FEFEFE"/>

  <!-- play button -->
  <circle cx="600" cy="790" r="46" fill="#0E0E0E"/>
  <path d="M 586 766 L 586 814 L 628 790 Z" fill="#ECC80B"/>

  <text x="80" y="840" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="10" fill="#0E0E0E">EDICIÓN</text>
</svg>
