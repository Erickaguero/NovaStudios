<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 700">
  <defs>
    <pattern id="ht" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="3.4" fill="#1A1A1A"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="60%" stop-color="#121212"/>
      <stop offset="100%" stop-color="#0E0E0E"/>
    </linearGradient>
    <radialGradient id="flare" cx="78%" cy="35%" r="45%">
      <stop offset="0%" stop-color="#ECC80B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#ECC80B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1920" height="700" fill="url(#bg)"/>
  <rect width="1920" height="700" fill="url(#ht)"/>
  <rect width="1920" height="700" fill="url(#flare)"/>

  <!-- film strip top -->
  <g fill="#ECC80B" opacity="0.85">
    <rect x="0" y="30" width="1920" height="10"/>
    <rect x="0" y="110" width="1920" height="10"/>
    <g>
      <rect x="40" y="55" width="60" height="40" rx="6"/>
      <rect x="160" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="280" y="55" width="60" height="40" rx="6"/>
      <rect x="400" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="520" y="55" width="60" height="40" rx="6"/>
      <rect x="640" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="760" y="55" width="60" height="40" rx="6"/>
      <rect x="880" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="1000" y="55" width="60" height="40" rx="6"/>
      <rect x="1120" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="1240" y="55" width="60" height="40" rx="6"/>
      <rect x="1360" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="1480" y="55" width="60" height="40" rx="6"/>
      <rect x="1600" y="55" width="60" height="40" rx="6" opacity="0.55"/>
      <rect x="1720" y="55" width="60" height="40" rx="6"/>
      <rect x="1840" y="55" width="60" height="40" rx="6" opacity="0.55"/>
    </g>
  </g>

  <!-- aperture right -->
  <g transform="translate(1560 420)" opacity="0.9">
    <circle cx="0" cy="0" r="190" fill="none" stroke="#ECC80B" stroke-width="5" opacity="0.6"/>
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FEFEFE" stroke-width="4" opacity="0.35"/>
    <g stroke="#ECC80B" stroke-width="5" fill="none" opacity="0.8">
      <path d="M 0 -110 L 95 -55"/>
      <path d="M 95 -55 L 95 55"/>
      <path d="M 95 55 L 0 110"/>
      <path d="M 0 110 L -95 55"/>
      <path d="M -95 55 L -95 -55"/>
      <path d="M -95 -55 L 0 -110"/>
    </g>
    <circle cx="0" cy="0" r="40" fill="#ECC80B" opacity="0.9"/>
  </g>

  <!-- camera silhouette left -->
  <g transform="translate(300 480)" opacity="0.45">
    <rect x="-120" y="-60" width="190" height="120" rx="16" fill="none" stroke="#FEFEFE" stroke-width="5"/>
    <rect x="70" y="-38" width="70" height="76" rx="10" fill="none" stroke="#FEFEFE" stroke-width="5"/>
    <circle cx="-75" cy="-100" r="34" fill="none" stroke="#FEFEFE" stroke-width="5"/>
    <circle cx="0" cy="-100" r="34" fill="none" stroke="#FEFEFE" stroke-width="5"/>
    <line x1="-25" y1="60" x2="-25" y2="120" stroke="#FEFEFE" stroke-width="5"/>
    <line x1="-25" y1="120" x2="-85" y2="185" stroke="#FEFEFE" stroke-width="5"/>
    <line x1="-25" y1="120" x2="35" y2="185" stroke="#FEFEFE" stroke-width="5"/>
  </g>

  <!-- waveform bottom center -->
  <g stroke="#ECC80B" stroke-width="6" stroke-linecap="round" opacity="0.5">
    <line x1="760" y1="600" x2="760" y2="570"/>
    <line x1="800" y1="615" x2="800" y2="555"/>
    <line x1="840" y1="630" x2="840" y2="540"/>
    <line x1="880" y1="610" x2="880" y2="560"/>
    <line x1="920" y1="640" x2="920" y2="530"/>
    <line x1="960" y1="615" x2="960" y2="555"/>
    <line x1="1000" y1="640" x2="1000" y2="530"/>
    <line x1="1040" y1="610" x2="1040" y2="560"/>
    <line x1="1080" y1="630" x2="1080" y2="540"/>
    <line x1="1120" y1="615" x2="1120" y2="555"/>
    <line x1="1160" y1="600" x2="1160" y2="570"/>
  </g>
</svg>
