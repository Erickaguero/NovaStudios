<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1000">
  <defs>
    <pattern id="ht" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#1D1D1D"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#ECC80B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ECC80B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="900" height="1000" fill="#0E0E0E"/>
  <rect width="900" height="1000" fill="url(#ht)"/>
  <rect width="900" height="1000" fill="url(#glow)"/>

  <circle cx="450" cy="380" r="230" fill="#161616" stroke="#ECC80B" stroke-width="8"/>
  <text x="450" y="420" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="150" font-weight="700" fill="#ECC80B" letter-spacing="4">GN</text>

  <!-- clapper icon -->
  <g transform="translate(450 760)" opacity="0.85">
    <rect x="-70" y="-30" width="140" height="90" rx="12" fill="none" stroke="#FEFEFE" stroke-width="6"/>
    <g transform="rotate(-16 -70 -34)">
      <rect x="-70" y="-56" width="140" height="24" rx="8" fill="#ECC80B"/>
    </g>
  </g>

  <text x="450" y="940" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="30" font-weight="600" letter-spacing="8" fill="#5A5A5A">DIRECCIÓN CREATIVA</text>
</svg>
