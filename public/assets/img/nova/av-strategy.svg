<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900">
  <defs>
    <pattern id="ht" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="6" cy="6" r="3.2" fill="#1D1D1D"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ECC80B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#ECC80B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="#0E0E0E"/>
  <rect width="1200" height="900" fill="url(#ht)"/>
  <rect width="1200" height="900" fill="url(#glow)"/>

  <!-- storyboard frames -->
  <g fill="none" stroke="#FEFEFE" stroke-width="6" opacity="0.5">
    <rect x="130" y="150" width="200" height="140" rx="14"/>
    <rect x="130" y="330" width="200" height="140" rx="14"/>
    <rect x="130" y="510" width="200" height="140" rx="14"/>
  </g>
  <g stroke="#ECC80B" stroke-width="6">
    <line x1="330" y1="220" x2="430" y2="400"/>
    <line x1="330" y1="400" x2="430" y2="400"/>
    <line x1="330" y1="580" x2="430" y2="400"/>
  </g>

  <!-- lightbulb -->
  <g transform="translate(660 400)">
    <circle cx="0" cy="0" r="170" fill="#161616" stroke="#ECC80B" stroke-width="8"/>
    <path d="M 0 -90 A 90 90 0 0 1 90 0 A 90 90 0 0 1 45 78 L 45 110 L -45 110 L -45 78 A 90 90 0 0 1 -90 0 A 90 90 0 0 1 0 -90 Z" fill="#ECC80B"/>
    <rect x="-38" y="120" width="76" height="18" rx="9" fill="#FEFEFE"/>
    <rect x="-30" y="148" width="60" height="16" rx="8" fill="#FEFEFE" opacity="0.7"/>
    <!-- rays -->
    <g stroke="#FEFEFE" stroke-width="7" stroke-linecap="round">
      <line x1="0" y1="-215" x2="0" y2="-260"/>
      <line x1="150" y1="-150" x2="185" y2="-185"/>
      <line x1="215" y1="0" x2="260" y2="0"/>
      <line x1="-150" y1="-150" x2="-185" y2="-185"/>
      <line x1="-215" y1="0" x2="-260" y2="0"/>
    </g>
  </g>

  <!-- target -->
  <g transform="translate(985 620)">
    <circle cx="0" cy="0" r="80" fill="none" stroke="#ECC80B" stroke-width="7"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ECC80B" stroke-width="7" opacity="0.7"/>
    <circle cx="0" cy="0" r="18" fill="#ECC80B"/>
  </g>

  <text x="80" y="820" font-family="Poppins, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="10" fill="#ECC80B">ESTRATEGIA</text>
  <text x="1120" y="820" text-anchor="end" font-family="Poppins, Arial, sans-serif" font-size="26" font-weight="600" letter-spacing="6" fill="#5A5A5A">NOVA STUDIOS</text>
</svg>
